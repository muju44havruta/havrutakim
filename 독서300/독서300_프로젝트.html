<title>하브루타 독서 300</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 책장(대주제 8개 × 학교급 5단계) 지도를 중심에 두고, 활동 화면은 왼쪽 목록 + 오른쪽 작업대 */
:root{
  --bg:#F3F5F8; --paper:#FFFFFF; --ink:#1B2233; --muted:#5C6578; --line:#D9DEE7; --soft:#E9EDF3;
  --accent:#24406E; --accent-ink:#FFFFFF; --ok:#2E7D4F; --warn:#B26A00; --bad:#B3261E;
  --tA:#C4553D; --tB:#B97F12; --tC:#3B8A57; --tD:#A3416B; --tE:#3E58A3; --tF:#1D838C; --tG:#7A6A2E; --tH:#6C4EA6;
  --display:"Gowun Batang", "Nanum Myeongjo", serif;
  --body:"Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151D; --paper:#1A1F2A; --ink:#E7EAF0; --muted:#9AA3B5; --line:#2E3545; --soft:#232A37;
  --accent:#8FB0E8; --accent-ink:#0E1420; --ok:#6CC08F; --warn:#E5A84B; --bad:#F08A80;
  --tA:#E5836C; --tB:#E0B04F; --tC:#6CBF88; --tD:#D57EA4; --tE:#859CE0; --tF:#58BFC7; --tG:#BDAA63; --tH:#A98DDC;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#11151D; --paper:#1A1F2A; --ink:#E7EAF0; --muted:#9AA3B5; --line:#2E3545; --soft:#232A37;
  --accent:#8FB0E8; --accent-ink:#0E1420; --ok:#6CC08F; --warn:#E5A84B; --bad:#F08A80;
  --tA:#E5836C; --tB:#E0B04F; --tC:#6CBF88; --tD:#D57EA4; --tE:#859CE0; --tF:#58BFC7; --tG:#BDAA63; --tH:#A98DDC;
  color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding-block:24px 16px}
.brand h1{font-size:30px;letter-spacing:-.5px}
.brand h1 b{color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.eyebrow{display:block;font-size:12px;letter-spacing:.6px;color:var(--muted);margin-bottom:2px}
.goals{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.goal{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;min-width:0}
.goal.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.goal b.n{font-family:var(--display);font-size:20px}
.goal .bar{height:5px;border-radius:3px;background:var(--soft);margin-top:4px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--accent)}
.daily{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted)}
.onchaek{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--ink);margin-right:6px;letter-spacing:.3px}
table.cls{border-collapse:collapse;width:100%;font-size:13.5px}
table.cls th,table.cls td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
@media (max-width:600px){ .goals{grid-template-columns:1fr} }
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.who select,.who input{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* progress shelf */
.shelf{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center}
.shelf .big{font-family:var(--display);font-size:34px;line-height:1}
.shelf .big small{font-size:15px;color:var(--muted)}
.spines{display:flex;gap:2px;height:28px;align-items:flex-end;min-width:0;overflow:hidden}
.spines i{flex:1 1 0;min-width:1px;border-radius:1px;background:var(--soft);height:60%}
.spines i.on{height:100%}
.shelf .legend{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

nav.tabs{display:flex;gap:4px;margin:18px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* map */
.map-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
table.map{border-collapse:collapse;width:100%;min-width:880px}
table.map th,table.map td{border-bottom:1px solid var(--line);padding:10px;vertical-align:top;text-align:left}
table.map thead th{font-size:13px;color:var(--muted);font-weight:500;background:var(--soft)}
table.map thead th.cur{color:var(--ink);font-weight:700}
table.map th.theme{width:200px;border-left:6px solid var(--tc)}
table.map th.theme h3{font-size:16px}
table.map th.theme p{margin:4px 0 0;font-size:12.5px;color:var(--muted);font-weight:400}
.cell{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-size:13px;line-height:1.45}
.cell:hover{border-color:var(--line);background:var(--soft)}
.cell.sel{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,transparent)}
.cell.cur{box-shadow:inset 0 0 0 1px var(--accent)}
table.map th.theme p.subj{color:var(--ink);font-weight:500;font-size:12px}
.cell .cnt{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.meter{display:block;height:4px;border-radius:2px;background:var(--soft);margin-top:4px;overflow:hidden}
.meter b{display:block;height:100%;background:var(--tc)}

.detail{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:12px;padding:18px}
.detail header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.detail h2{font-size:22px}
.bigq{font-family:var(--display);font-size:17px;margin:6px 0 0}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
.steps4 div{background:var(--soft);border-radius:8px;padding:10px 12px;min-width:0}
.steps4 b{display:block;font-size:12px;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.steps4 p{margin:0;font-size:14px}
.steps4 p+p{margin-top:6px;color:var(--muted);font-size:13px}
.arrow-path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:6px}
.arrow-path span{padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.arrow-path span.cur{border-color:var(--tc);color:var(--ink);font-weight:700}

/* books */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.toolbar input[type=search]{flex:1 1 220px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.book{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:8px;padding:9px 11px;min-width:0}
.book input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.book .t{font-weight:700;font-size:14.5px;line-height:1.4}
.book .m{grid-column:2;font-size:12.5px;color:var(--muted)}
.chips{grid-column:2;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.t{border-color:var(--tc);color:var(--tc);font-weight:500}
.book.done{background:color-mix(in srgb,var(--tc) 7%,var(--paper))}

/* buttons */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 14px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}

/* activity */
.act{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.cards{display:flex;flex-direction:column;gap:6px}
.card-item{text-align:left;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:8px;padding:9px 11px}
.card-item[aria-current="true"]{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc)}
.card-item b{display:block;font-size:14px}
.card-item span{font-size:12px;color:var(--muted)}
.bench{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:12px;padding:18px;min-width:0}
.bench h2{font-size:21px}
ol.flow{list-style:none;padding:0;margin:14px 0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;counter-reset:f}
ol.flow li{counter-increment:f;font-size:12px;padding:8px 6px 8px 8px;border-radius:6px;background:var(--soft);color:var(--muted);line-height:1.35;min-width:0}
ol.flow li::before{content:counter(f);display:block;font-family:var(--display);font-size:17px;font-weight:700}
ol.flow li.done{background:color-mix(in srgb,var(--ok) 14%,var(--paper));color:var(--ink)}
ol.flow li.now{background:var(--accent);color:var(--accent-ink)}
section.part{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
section.part>header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:baseline}
section.part h3{font-size:17px}
.q{background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
.q b{color:var(--muted);font-size:12px;margin-right:6px}
label.f{display:block;font-size:13px;font-weight:500;margin:10px 0 4px}
textarea,input.tx,select.tx{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-width:0}
textarea{min-height:68px}
textarea.long{min-height:220px}
.cnt-line{font-size:12px;color:var(--muted);text-align:right;margin-top:2px}
.cnt-line.good{color:var(--ok)} .cnt-line.low{color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;background:var(--bg)}
.ai h4{margin:0 0 6px;font-size:15px}
.lvls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.lv{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;min-width:0}
.lv .k{font-size:12px;color:var(--muted)}
.pips{display:flex;gap:3px;margin:4px 0}
.pips i{flex:1;height:6px;border-radius:3px;background:var(--soft)}
.pips i.on{background:var(--accent)}
.lv p{margin:4px 0 0}
.ai ul{margin:6px 0;padding-left:20px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mut{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.notice{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--paper));padding:8px 12px;border-radius:6px;font-size:13.5px;margin:10px 0}
.lock{font-size:13px;color:var(--muted);margin-top:6px}
.issues{margin:6px 0;padding-left:18px;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px}
.guide{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px;max-width:860px}
.guide h2{font-size:21px;margin-top:18px}
.guide h2:first-child{margin-top:0}
.guide ol,.guide ul{padding-left:20px}
.guide table{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
.guide td,.guide th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tblwrap{overflow-x:auto}
.fn{font-size:12.5px;color:var(--muted)}
sup a{text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);max-width:min(720px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.35)}
@media (max-width:860px){
  .act{grid-template-columns:1fr}
  .steps4,.lvls{grid-template-columns:1fr 1fr}
  ol.flow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
}
@media (max-width:480px){ .steps4,.lvls{grid-template-columns:1fr} .brand h1{font-size:25px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function nbytes(s){ let n=0; for(const ch of String(s||"")){ const c=ch.codePointAt(0); n += ch==="\n"?2 : c<128?1 : 3; } return n; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2200); }
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast("복사했습니다"); return true; }
  catch(e){ openDialog("직접 복사하세요", `<textarea class="long" readonly id="cp-area">${esc(text)}</textarea><p class="small muted">자동 복사가 막혀 있어 글을 선택해 두었습니다. Ctrl+C(⌘+C)로 복사하세요.</p>`); const a=$("#cp-area"); a.focus(); a.select(); return false; }
}

/* 금지어(학생부 기재 금지·주의) 점검 — 교육부 학교생활기록부 기재요령 기준 요약 */
const FORBID = [
  ["대회·수상","금지",/(대회|경시|경연|공모전|올림피아드|수상|입상|(금|은|동|최우수|우수|장려|특)상(?!상|황|태|관)|본선\s*진출)/g],
  ["교외 인증·어학시험","금지",/(토익|토플|텝스|TOEIC|TOEFL|TEPS|HSK|JLPT|한국사\s*능력\s*검정|한자\s*능력\s*검정|급수\s*취득)/g],
  ["논문·출판·특허","금지",/(학회|학술지|논문\s*(투고|등재)|출간|특허)/g],
  ["해외 활동","금지",/(어학\s*연수|해외\s*(봉사|연수|캠프|탐방))/g],
  ["사교육 유발","주의",/((?<!대)학원|과외(?!\s*활동)|인강|컨설팅)/g],
  ["부모·가정 배경","금지",/(아버지|어머니|부모님?)(의|께서)?\s*(직업|직장|회사|사회적\s*지위)/g],
  ["특정 대학·기관명","주의",/([가-힣]{2,}대학교|[가-힣]{2,}대(?=\s|에|의|를))/g],
  ["학생 이름 노출","주의",null]
];
function checkRecord(text, name){
  const out=[];
  FORBID.forEach(([cat,lv,re])=>{
    if(!re){ if(name && name.length>=2 && text.includes(name)) out.push({cat,lv,hits:[name]}); return; }
    const hits=[...new Set((text.match(re)||[]))]; if(hits.length) out.push({cat,lv,hits});
  });
  return out;
}

let samplePromise=null;
function getSample(){ if(!samplePromise) samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample").catch(()=>null) : Promise.resolve(null); return samplePromise; }
const errMsg = code => ({not_granted:"AI 사용이 허용되지 않았습니다. ‘AI 요청문 복사’로 Claude에 직접 물어본 뒤 ‘AI 답변 붙여넣기’를 쓰세요.", rate_limited:"요청이 많습니다. 잠시 뒤 다시 눌러 주세요."}[code] || "AI 응답을 받지 못했습니다. ‘AI 요청문 복사’로 Claude에 직접 물어본 뒤 답변을 붙여넣으세요.");

async function runAI(n){
  const c=curCard(); if(!c) return;
  if(filled(c)<20){ toast("먼저 활동 내용을 작성하세요"); return; }
  const sample=await getSample();
  const prompt = n===1? evalPrompt(c,1) : (c.v1? evalPrompt(c,2) : null);
  if(n===2 && !c.v1){ toast("1차 평가를 먼저 받으세요"); return; }
  if(!sample){ openPaste(n, prompt, true); return; }
  const out=$(`#ai${n}-out`); out.innerHTML=`<p class="muted">평가하는 중입니다… (보통 20~60초)</p>`;
  document.querySelectorAll(`[data-ai="${n}"]`).forEach(b=>b.disabled=true);
  try{
    const {text}=await sample(prompt,{modelTier:"default"});
    acceptAI(n, text);
  }catch(e){ out.innerHTML=`<p class="notice">${esc(errMsg(e&&e.code))}</p>`; document.querySelectorAll(`[data-ai="${n}"]`).forEach(b=>b.disabled=false); }
}
function acceptAI(n, text){
  const c=curCard(); const j=parseAI(text);
  const res = j ? Object.assign(j,{at:new Date().toLocaleString("ko-KR")}) : {raw:String(text), at:new Date().toLocaleString("ko-KR")};
  if(n===1){ c.v1=JSON.parse(JSON.stringify(c.cur)); c.ai1=res; }
  else if(n===2){ c.v2=JSON.parse(JSON.stringify(c.cur)); c.ai2=res; }
  save(); renderAll(); document.getElementById("ai"+n)?.scrollIntoView({behavior:"smooth",block:"start"});
}
async function runRec(){
  const c=curCard(); const sample=await getSample(); const prompt=recPrompt(c);
  if(!sample){ openPaste("rec", prompt, true); return; }
  const btn=document.querySelector('[data-rec="make"]'); btn.disabled=true; btn.textContent="작성하는 중…";
  try{ const {text}=await sample(prompt,{modelTier:"default"}); acceptRec(text); }
  catch(e){ toast(errMsg(e&&e.code)); btn.disabled=false; btn.textContent="특기사항 초안 만들기"; }
}
function acceptRec(text){
  const c=curCard(); const j=parseAI(text);
  c.record.text = j&&j.record ? j.record : String(text).trim();
  if(j&&j.short) c.record.short=j.short;
  save(); renderAll();
}

  <h2>독서 300 프로젝트란</h2>
  <p>전북특별자치도교육청 10대 핵심과제의 하나로, 초·중·고 12년 동안 성장 단계에 맞추어 300권을 완독하는 장기 독서 프로젝트입니다.<sup><a href="#fn1">[1]</a></sup> 이 프로그램은 교육청의 <b>초등·중학생·고등학생 추천 도서 각 100선</b>(300권)을 8개 대주제로 다시 묶어, 같은 질문을 학교급에 따라 점점 깊게 탐구하도록 설계했습니다.<sup><a href="#fn3">[3]</a></sup></p>

  <h2>도교육청 ‘독서 300 프로젝트’와의 연결</h2>
  <p>도교육청은 12년 동안 <b>초등 150권 · 중학교 100권 · 고등학교 50권</b>을 목표로 하고,<sup><a href="#fn6">[6]</a></sup> 전북형 독서 브랜드 ‘온책’ 아래 5대 전략을 추진합니다. 학생 독서 기록은 ‘독서로’에 12년 포트폴리오로 쌓입니다.<sup><a href="#fn7">[7]</a></sup> 이 프로그램은 그중 <b>교실 수업과 기록</b>을 맡는 실천 도구입니다.</p>
  <div class="tblwrap"><table><tr><th>5대 전략</th><th>도교육청 내용</th><th>이 프로그램의 기능</th></tr>
   <tr><td><span class="onchaek">온책읽기</span></td><td>학교별 매일 독서 시간, 독서 기록 습관</td><td>‘오늘 읽은 시간 기록’, 연속 독서일·월 독서 시간, 학교급 목표(150·100·50) 진도와 연간 권장 권수</td></tr>
   <tr><td><span class="onchaek">온책잇기</span></td><td>교과 연계 독서 수업</td><td>활동 카드의 연계 교과 지정, 초등 성취기준·중학 연계 교과 표시, 특기사항을 해당 교과 세특 문구로 작성</td></tr>
   <tr><td><span class="onchaek">온책열기</span></td><td>인문학 프로그램, 전북형 독서토론, 학생 저자 지원</td><td>읽기→토론→논술→구술 4단계, 하브루타 질문 만들기, 2회 AI 피드백과 고쳐 쓰기, ‘나의 글 모음집’(학생 문집)</td></tr>
   <tr><td><span class="onchaek">온책도서관</span></td><td>학교도서관 기능 강화, 학생교육문화관 협력</td><td>대주제·학교급별 도서 목록으로 학교도서관 장서 구성과 ‘온책읽기 학교대출’ 신청 목록 작성에 활용</td></tr>
   <tr><td><span class="onchaek">온책마을</span></td><td>학부모 독서교육, 지역 연계, 온책이음 마음우편</td><td>‘온책이음 마음엽서’ 쓰기(가족·친구·작가에게), 가정에서 함께 쓰는 자유 도서 기록</td></tr>
   <tr><td><span class="onchaek">독서로</span></td><td>12년 독서 포트폴리오</td><td>독서로 입력용 목록(CSV)과 활동 파일 내보내기로 학년이 바뀌어도 기록을 이어 감</td></tr></table></div>

  <h2>주안점 1. 대주제 × 학교급 심화 구조</h2>
  <div class="tblwrap"><table><tr><th>대주제</th><th>교과 영역(대략)</th><th>12년 대질문</th><th>초1~2 → 고등 질문의 심화</th></tr>
  ${THEMES.map(t=>`<tr><td><i class="dot" style="background:var(--t${t.id})"></i>${t.name}</td><td>${t.subj}</td><td>${t.big}</td><td class="small">${STAGES.map(s=>esc(t.q[s.id][0])).join(" → ")}</td></tr>`).join("")}</table></div>
  <p class="small muted">교과 영역은 수업 연계를 위한 대략적인 구분입니다. 한 권의 책이 여러 교과에 걸칠 수 있고, 수학은 ‘과학기술과 미래’ 도서와 고등 수학교과 연계 20권(보충)으로 운영합니다.</p>
  <p class="small muted">질문은 2022 개정 국어과 교육과정의 학년군별 읽기·문학 성취 수준(인물의 마음 짐작 → 사실과 의견 구분 → 글 구조 요약·주장 → 비유·상징 해석·다양한 관점 비교 → 비판적·창의적 통합)을 따라 높아지도록 구성했습니다.<sup><a href="#fn4">[4]</a></sup> 초등 도서에는 교육청 참고자료의 관련 성취기준 코드를, 중학 도서에는 추천 학년·연계 교과를 함께 표시했습니다.</p>

  <h2>주안점 2. 읽기 → 토론 → 논술 → 구술</h2>
  <div class="tblwrap"><table><tr><th>단계</th><th>기능</th><th>학생 활동</th></tr>
    <tr><td>① 독서(읽기)</td><td>이해·해석</td><td>요약, 인상 깊은 문장, 핵심 질문에 대한 생각과 근거, 삶·사회와 연결</td></tr>
    <tr><td>② 토론</td><td>듣기·말하기 연습</td><td>입장과 한 문장 주장, 근거 2개, 예상 반론과 재반박, 경청 후 달라진 생각</td></tr>
    <tr><td>③ 논술</td><td>쓰기</td><td>학교급별 분량(3~5문장 → 300자 → 500자 → 800자 → 1,200~1,600자)의 논증적 글</td></tr>
    <tr><td>④ 구술</td><td>듣기·말하기 심화</td><td>구술 질문 답변 원고, 꼬리 질문 대응, 말하기 성찰</td></tr></table></div>
  <p class="small muted">토론으로 다른 관점을 먼저 듣고 정리한 뒤 쓰기로 옮기고, 쓴 내용을 다시 즉석 질의응답으로 검증하는 순서입니다. 초등 저학년은 ‘이야기 나누기·생각 쓰기·발표하기’로 낮추어 운영합니다.</p>

  <h2>주안점 3. 6단계 피드백 순환</h2>
  <ol><li><b>학생 자기주도 활동</b>: ①~④ 작성</li>
    <li><b>1차 AI 평가·피드백</b>: 영역별 4단계 수준(시작·발전·도달·심화), 잘한 점, 고칠 점, 수정 과제 3개</li>
    <li><b>학생 수정·보완</b>: 1차 제출본은 자동 보관</li>
    <li><b>2차 AI 평가·피드백</b>: 1차와 비교해 성장한 점과 남은 과제</li>
    <li><b>교사 피드백</b>: 교사 모드에서 영역별 판정·코멘트(토론·구술은 수업 관찰로 보정)</li>
    <li><b>독서활동 특기사항 문구</b>: 학생 활동·AI 평가·교사 관찰을 모아 초안 작성, 1,500바이트·금지어 자동 점검</li></ol>

  <h2>수업 운영 예시 (한 권 · 4차시)</h2>
  <div class="tblwrap"><table><tr><th>차시</th><th>수업</th><th>프로그램</th></tr>
   <tr><td>1</td><td>대주제 질문 제시, 책 읽기(사전 독서 권장)</td><td>대주제 지도에서 칸 선택 → 활동 시작, ① 작성</td></tr>
   <tr><td>2</td><td>모둠·학급 토론</td><td>② 작성(경청 후 달라진 생각 포함)</td></tr>
   <tr><td>3</td><td>논술 쓰기 → 1차 AI 피드백 → 고쳐 쓰기</td><td>③ 작성, 1차 평가, 수정</td></tr>
   <tr><td>4</td><td>구술(짝 면접·학급 발표) → 2차 AI 피드백 → 파일 제출</td><td>④ 작성, 2차 평가, 내보내기</td></tr></table></div>

  <h2>학생부 기재 유의사항</h2>
  <ul><li>2024학년도 대입(졸업생 포함)부터 ‘독서활동상황’은 상급학교 진학 자료로 제공되지 않습니다. 단순 독후활동 외의 교육활동은 도서명을 포함해 교과 세특·창체 등 다른 영역에 입력할 수 있습니다.<sup><a href="#fn2">[2]</a></sup></li>
   <li>교과 세특은 과목당 500자(1,500바이트) 이내입니다. 학교급·학년도의 기재요령을 반드시 확인하세요.<sup><a href="#fn5">[5]</a></sup></li>
   <li>AI가 만든 평가와 문구는 초안입니다. 교사가 관찰한 사실만 남기고 직접 고쳐 쓰세요.</li></ul>

/* ───────────── 전체 렌더 · 이벤트 ───────────── */
function renderAll(){
  renderWho(); renderShelf();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===S.tab));
  ({map:renderMap, books:renderBooks, act:renderAct, data:renderData, guide:renderGuide})[S.tab]();
}
document.addEventListener("click", e=>{
  const el=e.target.closest("button,[data-cell]"); if(!el) return;
  const d=el.dataset;
  if(d.tab){ S.tab=d.tab; save(); renderAll(); return; }
  if(d.cell){ const [t,s]=d.cell.split("|"); S.sel={theme:t,stage:s}; save(); renderMap(); document.querySelector(".detail").scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(d.start){ const [t,s]=d.start.split("|"); newCard(t,s); return; }
  if(d.card){ S.curCard=d.card; save(); renderAct(); return; }
  if(d.unbook){ const c=curCard(); c.books=c.books.filter(x=>x!==d.unbook); save(); renderAct(); return; }
  if(d.ai){ runAI(+d.ai); return; }
  if(d.aicopy){ const c=curCard(); copyText(d.aicopy==="rec"?recPrompt(c):evalPrompt(c, d.aicopy==="2"&&c.v1?2:1)); return; }
  if(d.aipaste){ openPaste(d.aipaste==="rec"?"rec":+d.aipaste); return; }
  if(d.rec){ runRec(); return; }
  if(d.copy){ const c=curCard(); copyText(d.copy==="neis"? c.books.map(id=>bookOf(id)).filter(Boolean).map(b=>`${b.title}(${b.author})`).join(", ") : d.copy==="post" ? `${c.post.to}\n\n${c.post.text}` : c.record.text); return; }
  switch(el.id){
    case "mode-st": S.mode="student"; save(); renderAll(); break;
    case "mode-tc": S.mode="teacher"; save(); renderAll(); break;
    case "who-edit": editStudent(false); break;
    case "card-new": { const c=curCard(); newCard(c?c.theme:"A", stageOfGrade(me().grade).id); break; }
    case "card-del": { const st=me(); const c=curCard(); if(el.dataset.armed){ st.cards=st.cards.filter(x=>x!==c); S.curCard=null; save(); renderAll(); } else { el.dataset.armed="1"; el.textContent="한 번 더 누르면 삭제"; } break; }
    case "nc-go": newCard($("#nc-th").value,$("#nc-st").value); break;
    case "log-add": openLog(); break;
    case "cb-add": { const ti=$("#cb-title").value.trim(); if(!ti){ toast("도서명을 입력하세요"); break; } const st=me();
      const b={id:"u-"+Date.now().toString(36), lv:stageOfGrade(st.grade).id, title:ti, author:$("#cb-author").value.trim()||"저자 미상", field:"자유 도서", kw:"", themes:[$("#cb-theme").value], extra:"", custom:true};
      st.custom.push(b); st.read[b.id]={d:today(),g:st.grade}; save(); renderShelf(); fillBooks(); $("#cb-title").value=""; $("#cb-author").value=""; toast("읽은 책에 추가했습니다"); break; }
    case "ex-doseoro": { const st=me(); saveFile(`독서300_독서로입력목록_${st.name||"학생"}_${today()}.csv`, doseoroCSV(st), "text/csv"); break; }
    case "ex-book": { const st=me(); saveFile(`독서300_나의문집_${st.name||"학생"}_${today()}.html`, anthology(st), "text/html"); break; }
    case "ex-me": { const st=me(); saveFile(`독서300_${st.num||""}${st.name||"학생"}_${today()}.json`, exportStudent(st), "application/json"); break; }
    case "ex-all": saveFile(`독서300_학급전체_${today()}.json`, JSON.stringify({dokseo300:1, exported:new Date().toISOString(), students:Object.values(S.students)},null,1), "application/json"); break;
    case "ex-csv": saveFile(`독서300_특기사항_${today()}.csv`, recordsCSV(), "text/csv"); break;
    case "im-go": importText($("#im-text").value); break;
    case "st-del": { if(el.dataset.armed){ delete S.students[S.cur]; if(!Object.keys(S.students).length){ const n=blankStudent(); S.students[n.id]=n; } S.cur=Object.keys(S.students)[0]; save(); renderAll(); } else { el.dataset.armed="1"; el.textContent="한 번 더 누르면 삭제됩니다"; } break; }
  }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.dataset.read){ const st=me(); if(el.checked) st.read[el.dataset.read]={d:today(),g:st.grade}; else delete st.read[el.dataset.read]; save(); renderShelf();
    el.closest(".book")?.classList.toggle("done", el.checked); return; }
  if(el.id==="who-sel"){ if(el.value==="__new"){ editStudent(true); renderWho(); } else { S.cur=el.value; S.curCard=null; save(); renderAll(); } return; }
  if(el.id==="bk-sel" && el.value){ const c=curCard(); c.books.push(el.value); const st=me(); if(!st.read[el.value]) st.read[el.value]={d:today(),g:st.grade}; save(); renderAll(); return; }
  if(["f-lv","f-th","f-only"].includes(el.id)){ F[el.id.slice(2)]=el.value; fillBooks(); return; }
  if(el.id==="subj-sel"){ curCard().subject=el.value; save(); return; }
  if(el.dataset.tl){ const c=curCard(); c.teacher.areas[el.dataset.tl]=+el.value; save(); return; }
  if(el.id==="im-file"){ [...el.files].forEach(f=>{ const r=new FileReader(); r.onload=()=>importText(r.result); r.readAsText(f); }); return; }
  if(el.dataset.f && el.tagName==="SELECT"){ setField(el); }
});
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.id==="f-q"){ F.q=el.value; fillBooks(); return; }
  if(el.dataset.f){ setField(el); return; }
  if(el.dataset.teacher){ curCard().teacher.comment=el.value; save(); return; }
  if(el.dataset.post){ curCard().post[el.dataset.post]=el.value; save(); return; }
  if(el.dataset.record){ const c=curCard(); c.record.text=el.value; save();
    const by=nbytes(el.value); const cnt=$("#rec-cnt"); cnt.textContent=`${el.value.length}자 · ${by.toLocaleString()}바이트 / 1,500바이트 (NEIS 기준: 한글 3, 영문·숫자 1, 줄바꿈 2)`; cnt.className="cnt-line num "+(by>1500?"low":"good");
    $("#rec-issues").innerHTML=issueHtml(checkRecord(el.value, me().name)); }
});
function setField(el){
  const c=curCard(); const [p,k]=el.dataset.f.split("."); c.cur[p][k]=el.value; save();
  if(p==="essay"){ const s=stageOf(c.stage), n=el.value.length, [lo,hi]=s.len; const cnt=$("#essay-cnt");
    cnt.textContent=`${n}자 (공백 포함) · 권장 ${s.lenTxt}`; cnt.className="cnt-line num "+(n>=lo&&n<=hi*1.15?"good":n?"low":""); }
}
renderAll();
getSample(); getDownloads();
