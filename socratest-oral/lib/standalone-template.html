<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f8b">
<title>구술 영상 제출</title>
<style>
:root{--brand:#1f5f8b;--ink:#1d2733;--muted:#64717e;--line:#dfe5eb;--bg:#f3f5f7;--green:#2f7d5b;--green-soft:#e7f4ed;--red:#c9372a;--red-soft:#fbece9;--yellow:#fff4d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,'Apple SD Gothic Neo','Malgun Gothic','Pretendard',system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:12px 16px}
.top b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top span{color:#d6e4ef;font-size:.85rem}
main{max-width:560px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 12px}
h2{font-size:1.1rem;margin:0 0 10px}h3{font-size:1rem;margin:14px 0 6px}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-size:.9rem;margin-right:6px}
.muted{color:var(--muted);font-size:.9rem}
label.f{display:block;font-weight:700;margin:12px 0 6px}
input[type=text]{width:100%;font:inherit;font-size:1.1rem;padding:14px;border:1.5px solid #b9c6d2;border-radius:12px}
input:focus{outline:3px solid #9cc8e6}
.steps{display:grid;gap:8px}
.steps label{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.steps label small{display:block;font-weight:400;color:var(--muted)}
.steps input{width:22px;height:22px;flex:none}
.steps label.on{border-color:var(--brand);background:#e9f2f8}
.steps label.exam.on{border-color:var(--red);background:var(--red-soft)}
.task{font-weight:700;background:#e9f2f8;border-left:5px solid var(--brand);padding:12px 14px;border-radius:8px;white-space:pre-wrap}
details summary{cursor:pointer;color:var(--brand);font-weight:700;padding:6px 0}
.passage{white-space:pre-wrap;background:#fbfaf6;border:1px solid #ebe5d6;border-radius:10px;padding:14px 16px;line-height:1.95}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--brand);color:#fff;font:inherit;font-weight:800;font-size:1.05rem;margin-top:10px;cursor:pointer;text-decoration:none;text-align:center;padding:8px 12px}
.btn.sub{background:#fff;color:var(--brand);border:2px solid var(--brand);min-height:50px;font-size:1rem}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn:disabled{opacity:.5}
.cam{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:62vh;margin:0 auto}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam video.mirror{transform:scaleX(-1)}
.cam .badge{position:absolute;left:10px;top:10px;background:rgba(201,55,42,.92);color:#fff;font-weight:800;border-radius:99px;padding:3px 12px;font-variant-numeric:tabular-nums}
.cam .guide{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:.88rem;padding:24px 12px 10px;text-align:center}
.meter{height:8px;margin:8px 0 0;background:#e3e8ed;border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--green)}
.rules{font-size:.92rem;margin:8px 0;padding-left:20px}
.file{display:block;border:2px dashed #b9c6d2;border-radius:12px;padding:16px;text-align:center;color:var(--brand);font-weight:700;cursor:pointer;margin-top:8px}
.file input{display:none}
video.review{width:100%;border-radius:12px;background:#000;max-height:60vh}
.warn{background:var(--yellow);border-radius:10px;padding:10px 12px;font-size:.92rem;margin:8px 0}
.err{background:var(--red-soft);color:#7a2215;border-radius:10px;padding:10px 12px;font-size:.92rem;margin:8px 0}
.ok{background:var(--green-soft);border-radius:10px;padding:12px;font-size:.95rem}
.mail{display:flex;gap:8px;align-items:center;background:#f6f8fa;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:700;word-break:break-all}
.mail button{flex:none;border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:6px 10px;font:inherit;font-size:.85rem;font-weight:700}
ol.how{margin:6px 0;padding-left:22px;font-size:.93rem}
.stepbox{border-left:4px solid var(--brand);padding:4px 0 4px 12px;margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top"><b id="title">구술 영상 제출</b><span id="sub"></span></div>
<main>
  <div id="envBox"></div>
  <div id="noClass" class="card hidden"><h2>수업 정보가 없어요</h2><p>선생님이 보내 준 <b>링크(또는 QR코드)</b>로 다시 열어 주세요.</p></div>

  <div id="app">
  <section class="card">
    <h2><span class="num">1</span>나는 누구인가요?</h2>
    <label class="f" for="alias">식별명 <span class="muted">(학년-반-번호, 예: 2-3-07)</span></label>
    <input type="text" id="alias" autocomplete="off" placeholder="2-3-07">
  </section>

  <section class="card">
    <h2><span class="num">2</span>몇 단계 녹화인가요?</h2>
    <div class="steps" id="steps">
      <label><input type="radio" name="n" value="1"><span>1단계 · 1차 구술<small>처음 말하는 답변</small></span></label>
      <label><input type="radio" name="n" value="2"><span>3단계 · 수정 구술<small>1차 피드백을 반영해 다시 말하기</small></span></label>
      <label class="exam"><input type="radio" name="n" value="3"><span>6단계 · 실전 최종 구술<small>2차 피드백을 반영한 실전 평가</small></span></label>
    </div>
  </section>

  <section class="card">
    <h2><span class="num">3</span>작품(지문)을 읽고 과제를 확인해요</h2>
    <details open><summary>제시문 전문</summary><div class="passage" id="passage"></div></details>
    <h3>구술 과제</h3>
    <div class="task" id="task"></div>
    <details><summary>평가 기준</summary><table id="rubric"></table></details>
  </section>

  <section class="card">
    <h2><span class="num">4</span>영상으로 녹화해요</h2>
    <ul class="rules">
      <li><b>얼굴이 화면 가운데</b>에 오게 하고, 처음부터 끝까지 카메라를 보며 말해요.</li>
      <li>녹화하는 동안 <b>메모·책·다른 화면을 보지 않아요.</b> (준비는 녹화 전에!)</li>
      <li>조용한 곳에서, 휴대폰을 세워 두고 녹화해요.</li>
    </ul>
    <div id="rec"></div>
  </section>

  <section class="card hidden" id="outCard">
    <h2><span class="num">5</span>선생님 메일로 제출해요</h2>
    <div id="out"></div>
  </section>
  </div>
</main>
<script>
'use strict';
// 교사 프로그램·교사용 HTML이 학생용 파일을 만들 때 아래 자리에 수업 정보를 넣습니다.
// 비어 있으면 링크 주소의 #c= 뒤에 담긴 수업 정보를 읽습니다.
const EMBED = /*__CLASS_JSON__*/ null /*__END__*/;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const mb = (n) => (n / 1048576).toFixed(1) + 'MB';
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch { return ''; } };
const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/.test(UA);
const IN_APP = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|BAND\/|DaumApps|everytimeApp/i.test(UA);
const IS_KAKAO = /KAKAOTALK/i.test(UA);
const MAIL_LIMIT = 25 * 1048576; // 대부분의 메일 첨부 한도
const EXT = { 'video/mp4': 'mp4', 'video/webm': 'webm', 'video/quicktime': 'mov', 'video/3gpp': '3gp', 'video/x-matroska': 'mkv' };
const BY_EXT = { mp4: 'video/mp4', m4v: 'video/mp4', webm: 'video/webm', mov: 'video/quicktime', '3gp': 'video/3gpp', mkv: 'video/x-matroska' };

async function readClass() {
  if (EMBED) return EMBED;
  const m = /[#&]c=([^&]+)/.exec(location.hash);
  if (!m) return null;
  const kind = m[1][0];
  const b64 = m[1].slice(1).replace(/-/g, '+').replace(/_/g, '/');
  const bytes = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
  let text;
  if (kind === 'z') {
    if (!window.DecompressionStream) throw new Error('브라우저가 오래되었어요. 크롬·사파리를 최신으로 업데이트하세요.');
    text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  } else text = new TextDecoder().decode(bytes);
  return JSON.parse(text);
}

let CLASS;
const canRecord = !!(window.isSecureContext && navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
const R = { blob: null, sec: 0, hidden: 0, source: '', t0: 0, peak: 0 };

function envNotice() {
  let h = '';
  if (IN_APP) {
    const url = location.href;
    const isWeb = /^https?:/.test(url);
    h = `<div class="card"><div class="err"><b>앱 안의 브라우저에서는 녹화·저장·메일 보내기가 잘 안 돼요.</b><br>${IS_IOS ? '오른쪽 아래(또는 위) <b>⋯ / 공유</b> → <b>Safari로 열기</b>를 눌러 주세요.' : '오른쪽 위 <b>⋮</b> → <b>다른 브라우저로 열기</b>(크롬)를 눌러 주세요.'}</div>
      ${isWeb && IS_KAKAO ? `<a class="btn" href="kakaotalk://web/openExternal?url=${encodeURIComponent(url)}">기본 브라우저로 열기</a>` : ''}
      ${isWeb && IS_ANDROID && !IS_KAKAO ? `<a class="btn" href="intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end">크롬으로 열기</a>` : ''}</div>`;
  } else if (!canRecord) {
    h = `<div class="card"><div class="warn"><b>이 화면에서는 바로 녹화할 수 없어요.</b> 파일로 열었거나 보안 주소(https)가 아니기 때문이에요. 선생님이 보낸 <b>링크</b>로 열면 바로 녹화할 수 있어요. 지금은 4번에서 <b>휴대폰 카메라</b>로 찍어 고르면 돼요.</div></div>`;
  }
  $('#envBox').innerHTML = h;
}

const fileBox = () => `<label class="file">📹 휴대폰 카메라로 찍기<input type="file" class="fin" accept="video/*" capture="user"></label>
  <label class="file">📁 찍어 둔 영상 고르기<input type="file" class="fin" accept="video/*"></label>
  <p class="muted">카메라 앱으로 찍으면 파일이 커서 메일로 안 보내질 수 있어요. <b>화질을 낮추고(720p 이하)</b> 짧게 찍어 주세요.</p>`;

let stream, mr, chunks, tick, ac, mimeUsed = '';
function idle(msg) {
  stopStream();
  $('#rec').innerHTML = `${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    ${canRecord
      ? `<button class="btn" id="camBtn">📷 카메라 켜기</button>
         <p class="muted" style="text-align:center">최대 ${mmss(CLASS.maxSeconds)} · 카메라와 마이크 사용을 "허용"해 주세요</p>
         <details><summary>여기서 녹화가 안 돼요</summary>${fileBox()}</details>`
      : fileBox()}`;
  if ($('#camBtn')) $('#camBtn').onclick = openCam;
  document.querySelectorAll('.fin').forEach((i) => (i.onchange = (e) => useFile(e.target.files[0])));
}
function stopStream() {
  stream?.getTracks().forEach((t) => t.stop());
  stream = null;
  ac?.close().catch(() => {});
  ac = null;
}
async function openCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15, max: 24 } },
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (e) {
    return idle(e?.name === 'NotAllowedError'
      ? '카메라·마이크가 허용되지 않았어요. 주소창 왼쪽 아이콘(아이폰: 설정 ▸ Safari ▸ 카메라·마이크)에서 "허용"으로 바꾼 뒤 다시 눌러 주세요.'
      : '카메라를 켤 수 없어요(' + (e?.name || '오류') + '). 다른 앱이 카메라를 쓰고 있는지 확인하거나 아래 "휴대폰 카메라로 찍기"를 쓰세요.');
  }
  $('#rec').innerHTML = `<div class="cam"><video id="pv" class="mirror" autoplay muted playsinline></video><div class="badge hidden" id="badge">● 0:00</div>
      <div class="guide" id="guide">얼굴이 화면 가운데 오게 맞춰요</div></div>
    <div class="meter"><i id="mt"></i></div><p class="muted" style="text-align:center;margin:4px 0" id="hint">말하면 초록 막대가 움직여요</p>
    <button class="btn red" id="goBtn">● 녹화 시작</button><button class="btn sub" id="offBtn">카메라 끄기</button>`;
  $('#pv').srcObject = stream;
  $('#goBtn').onclick = startRec;
  $('#offBtn').onclick = () => idle();
  meter();
}
function meter() {
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(stream).connect(an);
    const d = new Uint8Array(512);
    const f = () => { if (!stream) return; an.getByteTimeDomainData(d); let p = 0; for (const v of d) p = Math.max(p, Math.abs(v - 128)); if (mr?.state === 'recording') R.peak = Math.max(R.peak, p); const m = $('#mt'); if (m) m.style.width = Math.min(100, p * 1.6) + '%'; requestAnimationFrame(f); };
    f();
  } catch { R.peak = -1; }
}
function startRec() {
  // 메일 첨부 한도를 넘지 않도록 화질을 낮춰 녹화합니다(3분 ≈ 10MB 안팎).
  const mime = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp8,opus', 'video/webm'].find((m) => MediaRecorder.isTypeSupported?.(m)) || '';
  try { mr = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), videoBitsPerSecond: 350000, audioBitsPerSecond: 64000 }); }
  catch { try { mr = new MediaRecorder(stream); } catch { return idle('이 브라우저는 영상 녹화를 지원하지 않아요. 아래 "휴대폰 카메라로 찍기"를 쓰세요.'); } }
  mimeUsed = mime;
  chunks = [];
  mr.ondataavailable = (e) => e.data && e.data.size && chunks.push(e.data);
  mr.onerror = (e) => idle('녹화 중 오류가 났어요: ' + (e.error?.name || '알 수 없음'));
  mr.start(1000);
  R.t0 = Date.now(); R.hidden = 0; R.peak = 0;
  document.onvisibilitychange = () => document.hidden && R.hidden++;
  $('#badge').classList.remove('hidden');
  $('#guide').textContent = '카메라를 보며 말해요 · 다른 것을 보지 않아요';
  $('#goBtn').textContent = '■ 녹화 끝내기';
  $('#goBtn').classList.remove('red');
  $('#goBtn').onclick = stopRec;
  $('#offBtn').classList.add('hidden');
  tick = setInterval(() => {
    const s = Math.floor((Date.now() - R.t0) / 1000), left = CLASS.maxSeconds - s;
    $('#badge').textContent = '● ' + mmss(s);
    if (left <= 30) $('#hint').textContent = `${left}초 남았어요`;
    if (left <= 0) stopRec();
  }, 250);
}
async function stopRec() {
  if (mr?.state !== 'recording') return;
  clearInterval(tick); document.onvisibilitychange = null;
  R.sec = Math.round((Date.now() - R.t0) / 1000);
  const done = new Promise((r) => (mr.onstop = r)); mr.stop(); await done;
  stopStream();
  const type = (mr.mimeType || mimeUsed || (IS_IOS ? 'video/mp4' : 'video/webm')).split(';')[0];
  R.blob = new Blob(chunks, { type });
  R.source = 'rec';
  if (!R.blob.size) return idle('녹화 파일이 비어 있어요. 크롬(안드로이드)·사파리(아이폰)로 다시 해 보거나 "휴대폰 카메라로 찍기"를 쓰세요.');
  review();
}
function useFile(f) {
  if (!f) return;
  let type = (f.type || '').split(';')[0];
  if (!EXT[type]) type = BY_EXT[(f.name.split('.').pop() || '').toLowerCase()] || '';
  if (!type) return idle('영상 파일(mp4·mov·webm)을 골라 주세요.');
  if (f.size < 5000) return idle('파일이 비어 있는 것 같아요. 다시 찍어 주세요.');
  R.blob = new Blob([f], { type }); R.hidden = 0; R.source = 'file'; R.t0 = f.lastModified || Date.now(); R.sec = 0; R.peak = -1;
  review();
}
function review() {
  const silent = R.source === 'rec' && R.peak >= 0 && R.peak < 4;
  const big = R.blob.size > MAIL_LIMIT;
  $('#rec').innerHTML = `<h3>녹화 확인 <span id="dur">${R.sec ? `(${mmss(R.sec)})` : ''}</span> · ${mb(R.blob.size)}</h3>
    ${silent ? '<div class="err"><b>소리가 거의 녹음되지 않았어요.</b> 재생해 보고, 소리가 없으면 다시 녹화하세요.</div>' : ''}
    ${big ? `<div class="warn">파일이 ${mb(R.blob.size)}로 커서 메일 첨부 한도(25MB)를 넘을 수 있어요. Gmail은 자동으로 드라이브 링크로 보내 주고, 다른 메일은 실패할 수 있어요. 가능하면 이 화면에서 다시 녹화하세요.</div>` : ''}
    <video class="review" controls playsinline preload="metadata" src="${URL.createObjectURL(R.blob)}"></video>
    <p class="muted">▶ 눌러서 <b>얼굴이 보이고 목소리가 잘 들리는지</b> 꼭 확인하세요.</p>
    <button class="btn" id="makeBtn">이 영상으로 제출하기</button>
    <button class="btn sub" id="againBtn">다시 녹화</button>`;
  const v = $('#rec video');
  v.onloadedmetadata = () => { if (!R.sec && isFinite(v.duration)) { R.sec = Math.round(v.duration); $('#dur').textContent = `(${mmss(R.sec)})`; } };
  $('#makeBtn').onclick = make;
  $('#againBtn').onclick = () => { R.blob = null; $('#outCard').classList.add('hidden'); idle(); };
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {
    const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {} t.remove(); return ok;
  }
}
function make() {
  const alias = $('#alias').value.trim();
  const n = Number(document.querySelector('[name=n]:checked')?.value || 0);
  if (alias.length < 2) { $('#alias').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('#alias').focus(); return alert('1번에 식별명을 입력하세요.'); }
  if (!n) { $('#steps').scrollIntoView({ behavior: 'smooth', block: 'center' }); return alert('2번에서 몇 단계 녹화인지 고르세요.'); }
  const step = { 1: 1, 2: 3, 3: 6 }[n];
  const stepName = { 1: '1단계 1차 구술', 2: '3단계 수정 구술', 3: '6단계 실전 최종 구술' }[n];
  const now = new Date();
  const hms = now.toTimeString().slice(0, 8).replace(/:/g, '');
  const safe = alias.replace(/[^\w-]/g, '_');
  const ext = EXT[R.blob.type] || 'mp4';
  // 파일 이름에 수업 코드·식별명·단계·녹화 방식이 들어 있어, 교사 프로그램이 그대로 읽어 들입니다(영문·숫자만 사용).
  const name = `oral_${CLASS.code}_${safe}_s${step}_${hms}_h${R.hidden}_${R.source}.${ext}`;
  const file = new File([R.blob], name, { type: R.blob.type });
  const email = CLASS.teacherEmail || '';
  const subject = `[구술평가] ${CLASS.title} / ${alias} / ${stepName}`;
  const body = [
    `${CLASS.title} 구술 영상을 제출합니다.`,
    '',
    `식별명: ${alias}`,
    `단계: ${stepName}`,
    `수업 코드: ${CLASS.code}`,
    `녹화 길이: ${R.sec ? mmss(R.sec) : '-'} · 파일 크기: ${mb(R.blob.size)}`,
    `녹화 방식: ${R.source === 'rec' ? '제출 화면에서 녹화' : '휴대폰 카메라 파일 첨부'}${R.source === 'rec' ? ` · 녹화 중 화면 이탈 ${R.hidden}회` : ''}`,
    `첨부 파일: ${name}`,
    `제출 시각: ${now.toLocaleString('ko-KR')}`,
  ].join('\n');
  const mailto = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body + '\n\n(※ 영상 파일을 첨부했는지 확인하세요)')}`;
  const canShare = !!navigator.canShare?.({ files: [file] });
  const url = URL.createObjectURL(file);
  $('#outCard').classList.remove('hidden');
  $('#out').innerHTML = `
    ${email ? `<p>받는 사람(선생님 메일)</p><div class="mail"><span style="flex:1">${esc(email)}</span><button id="copyMail">주소 복사</button></div>`
      : '<div class="err">선생님 메일 주소가 등록되지 않았어요. 영상을 저장한 뒤 선생님이 안내한 곳으로 제출하세요.</div>'}
    ${canShare && email ? `
      <div class="stepbox"><b>방법 1 · 영상을 붙여서 바로 보내기 (권장)</b>
        <ol class="how"><li>아래 버튼을 누르면 선생님 주소가 <b>복사</b>되고 공유 창이 열려요.</li><li><b>Gmail</b>(또는 메일 앱)을 고르세요. 영상이 첨부된 채로 열려요.</li><li><b>받는 사람</b> 칸을 길게 눌러 <b>붙여넣기</b> → 보내기!</li></ol>
        <button class="btn green" id="shareBtn">📧 메일 앱으로 영상 보내기</button></div>` : ''}
    <div class="stepbox"><b>${canShare && email ? '방법 2 · ' : ''}영상 저장 후 메일에 첨부하기</b>
      <ol class="how"><li><b>[영상 저장]</b>을 눌러 휴대폰에 저장해요. (안드로이드: 내 파일 ▸ 다운로드 / 아이폰: 파일 앱 ▸ 다운로드)</li>
      ${email ? '<li><b>[메일 쓰기]</b>를 누르면 받는 사람·제목·내용이 자동으로 채워져요.</li><li>📎 <b>첨부</b>를 눌러 방금 저장한 영상을 고른 뒤 보내요.</li>' : ''}</ol>
      <a class="btn ${canShare && email ? 'sub' : ''}" href="${url}" download="${esc(name)}">⬇ 영상 저장 (${mb(R.blob.size)})</a>
      ${email ? `<a class="btn ${canShare ? 'sub' : 'green'}" href="${esc(mailto)}">✉ 메일 쓰기 (주소·제목 자동)</a>` : ''}</div>
    <p class="muted">메일 제목: ${esc(subject)}<br>파일 이름: ${esc(name)}<br>보낸 메일함에서 <b>첨부 파일이 있는지</b> 꼭 확인하세요.</p>`;
  if ($('#copyMail')) $('#copyMail').onclick = async () => alert((await copy(email)) ? '선생님 메일 주소를 복사했어요.' : '복사가 안 돼요. 주소를 직접 적어 주세요: ' + email);
  if ($('#shareBtn')) $('#shareBtn').onclick = async () => {
    await copy(email);
    try { await navigator.share({ files: [file], title: subject, text: `받는 사람: ${email}\n\n${body}` }); }
    catch (e) { if (e?.name !== 'AbortError') alert('공유 창을 열 수 없어요. 방법 2를 써 주세요.'); }
  };
  $('#outCard').scrollIntoView({ behavior: 'smooth' });
}

(async () => {
  try { CLASS = await readClass(); } catch (e) { CLASS = null; $('#noClass').innerHTML += `<p class="err">${esc(e.message)}</p>`; }
  if (!CLASS) { $('#app').classList.add('hidden'); $('#noClass').classList.remove('hidden'); return; }
  CLASS.maxSeconds = Number(CLASS.maxSeconds) || 180;
  CLASS.rubric = Array.isArray(CLASS.rubric) ? CLASS.rubric : [];
  document.title = '구술 영상 · ' + CLASS.title;
  $('#title').textContent = CLASS.title;
  $('#sub').textContent = `${CLASS.areaLabel || ''} · 수업 코드 ${CLASS.code}`;
  $('#task').textContent = CLASS.task;
  $('#passage').textContent = CLASS.passage;
  $('#rubric').innerHTML = CLASS.rubric.map((r) => `<tr><th>${esc(r.name)} (${r.points}점)</th><td class="muted">${esc(r.desc)}</td></tr>`).join('');
  $('#alias').value = store('soAlias');
  $('#alias').oninput = () => store('soAlias', $('#alias').value.trim());
  document.querySelectorAll('#steps input').forEach((i) => (i.onchange = () => document.querySelectorAll('#steps label').forEach((l) => l.classList.toggle('on', l.querySelector('input').checked))));
  envNotice();
  idle();
})();
</script>
</body>
</html>
